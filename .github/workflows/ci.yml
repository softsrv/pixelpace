name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      valkey:
        image: valkey/valkey
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pixelpace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pixelpace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: Unit tests
        run: go test ./...

      - name: Apply migrations
        run: |
          for f in $(ls db/migrations/*.up.sql | sort); do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pixelpace_test?sslmode=disable

      # -p 1: every DB-backed package shares the one test database, so run
      # packages one at a time to keep their fixtures from interleaving.
      - name: Integration tests
        run: go test -tags integration -p 1 ./...
        env:
          VALKEY_ADDR: localhost:6379
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pixelpace_test?sslmode=disable

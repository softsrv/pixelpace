# Deployment: runs the published app image with a private Valkey for live race
# fan-out. (The repo-root compose.yaml is the local development stack.)
# Postgres is external: DATABASE_URL and the other settings come from the
# repo-root .env (see .env.example), or the file PIXELPACE_CONFIG names. To use
# the Valkey below, set VALKEY_ADDR=valkey:6379; services reach each other by
# name on the project's network. Relative paths resolve against this
# directory. Migrations never run on startup; apply them first with
#
#   docker compose -f deploy/docker-compose.yml run --rm migrate
#
# then start everything with `docker compose -f deploy/docker-compose.yml up -d`.
services:
  app:
    image: trriplejay/pixelpace:${PIXELPACE_TAG:-latest}
    build: ..
    # The app reads its settings from this dotenv file, mounted where the
    # image's CONFIG_FILE points. PIXELPACE_CONFIG picks a different host
    # file. The variables below override the file.
    volumes:
      - ${PIXELPACE_CONFIG:-../.env}:/config/.env:ro
    environment:
      CONFIG_FILE: /config/.env
      PORT: "8080"
    ports:
      # Loopback only by default, for a reverse proxy on the same host (it
      # must serve HTTPS: Web Bluetooth and Secure cookies require it). Set
      # APP_BIND=0.0.0.0 to expose the port directly.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      valkey:
        condition: service_healthy
    # The app drains in-flight requests and race starts for up to 30s.
    stop_grace_period: 35s
    restart: unless-stopped

  # Pub/sub only: the app stores nothing in Valkey, so persistence is off and
  # the port is reachable only from the app.
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-off: docker compose run --rm migrate [up|down 1|version]
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    # DATABASE_URL comes from the same config file the app reads.
    env_file: ${PIXELPACE_CONFIG:-../.env}
    volumes:
      - ../db/migrations:/migrations:ro
    entrypoint: ["sh", "-c", 'exec migrate -path /migrations -database "$$DATABASE_URL" "$$@"', "migrate"]
    command: ["up"]

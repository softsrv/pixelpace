{{define "title"}}Reset Password{{end}}

{{define "content"}}
<section class="pp-panel pp-auth overflow-hidden" aria-labelledby="pp-auth-title">
  {{template "pp-scene"}}
  <div class="pp-section">
    <div class="space-y-1 text-center">
      <p class="pp-kicker pp-arcade">Continue?</p>
      <h1 id="pp-auth-title" class="pp-title pp-title-lg">Reset Password</h1>
    </div>
    <p class="pp-muted text-sm text-center">
      Enter your email address and we'll send you a reset link if an account exists.
    </p>

    <div id="form-result"></div>

    <form hx-post="/auth/forgot-password"
          hx-target="#form-result"
          hx-swap="innerHTML"
          class="space-y-5">
      <label class="block space-y-2" for="email">
        <span class="pp-label pp-arcade">Email</span>
        <input id="email" name="email" type="email" required
               class="pp-field"
               autocomplete="email" />
      </label>

      <button type="submit" class="pp-btn w-full">Send Reset Link</button>
    </form>

    <p class="text-center text-sm">
      <a href="/login" class="pp-link">Back to sign in</a>
    </p>
  </div>
</section>
{{end}}

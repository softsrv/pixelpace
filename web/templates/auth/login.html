{{define "title"}}Sign In{{end}}

{{define "content"}}
<section class="pp-panel pp-auth overflow-hidden" aria-labelledby="pp-auth-title">
  {{template "pp-scene"}}
  <div class="pp-section">
    <div class="space-y-1 text-center">
      <p class="pp-kicker pp-arcade">Player login</p>
      <h1 id="pp-auth-title" class="pp-title pp-title-lg">Sign In</h1>
    </div>

    <div id="form-error"></div>

    <form hx-post="/auth/login"
          hx-target="#form-error"
          hx-swap="innerHTML"
          class="space-y-5">
      <label class="block space-y-2" for="email">
        <span class="pp-label pp-arcade">Email</span>
        <input id="email" name="email" type="email" required
               class="pp-field"
               autocomplete="email" />
      </label>

      <div class="space-y-2">
        <label class="pp-label pp-arcade" for="password">Password</label>
        <input id="password" name="password" type="password" required
               class="pp-field"
               autocomplete="current-password" />
        <a href="/forgot-password" class="pp-link text-xs">Forgot password?</a>
      </div>

      <button type="submit" class="pp-btn w-full"><span aria-hidden="true">&#9654;</span> Sign In</button>
    </form>

    <p class="text-center text-sm">
      Don't have an account?
      <a href="/register" class="pp-link pp-link-pink">Sign up</a>
    </p>
  </div>
</section>
{{end}}

{{define "title"}}Create Account{{end}}

{{define "content"}}
<section class="pp-panel pp-auth overflow-hidden" aria-labelledby="pp-auth-title">
  {{template "pp-scene"}}
  <div class="pp-section">
    <div class="space-y-1 text-center">
      <p class="pp-kicker pp-arcade">New player</p>
      <h1 id="pp-auth-title" class="pp-title pp-title-lg">Create Account</h1>
    </div>

    <div id="form-error"></div>

    <form hx-post="/auth/register"
          hx-target="#form-error"
          hx-swap="innerHTML"
          class="space-y-5">
      <label class="block space-y-2" for="email">
        <span class="pp-label pp-arcade">Email</span>
        <input id="email" name="email" type="email" required
               class="pp-field"
               autocomplete="email" />
      </label>

      <label class="block space-y-2" for="password">
        <span class="pp-label pp-arcade">Password</span>
        <input id="password" name="password" type="password" required
               class="pp-field"
               autocomplete="new-password"
               minlength="8" />
        <span class="pp-hint block">Minimum 8 characters</span>
      </label>

      <button type="submit" class="pp-btn w-full"><span aria-hidden="true">&#9654;</span> Create Account</button>
    </form>

    <p class="text-center text-sm">
      Already have an account?
      <a href="/login" class="pp-link pp-link-pink">Sign in</a>
    </p>
  </div>
</section>
{{end}}

{{define "title"}}Set New Password{{end}}

{{define "content"}}
<section class="pp-panel pp-auth overflow-hidden" aria-labelledby="pp-auth-title">
  {{template "pp-scene"}}
  <div class="pp-section">
    <div class="space-y-1 text-center">
      <p class="pp-kicker pp-arcade">Continue?</p>
      <h1 id="pp-auth-title" class="pp-title pp-title-lg">Set New Password</h1>
    </div>

    <div id="form-error"></div>

    <form hx-post="/auth/reset-password"
          hx-target="#form-error"
          hx-swap="innerHTML"
          class="space-y-5">
      <input type="hidden" name="token" value="{{.Token}}" />

      <label class="block space-y-2" for="password">
        <span class="pp-label pp-arcade">New Password</span>
        <input id="password" name="password" type="password" required
               class="pp-field"
               autocomplete="new-password"
               minlength="8" />
        <span class="pp-hint block">Minimum 8 characters</span>
      </label>

      <button type="submit" class="pp-btn w-full"><span aria-hidden="true">&#9654;</span> Set Password</button>
    </form>
  </div>
</section>
{{end}}

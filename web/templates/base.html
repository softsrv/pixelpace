<!DOCTYPE html>
<!-- To switch themes, change data-theme to any DaisyUI theme name.
     Built-in themes: light, dark, cupcake, dracula, synthwave, retro,
     cyberpunk, valentine, halloween, garden, forest, aqua, lofi, pastel,
     fantasy, wireframe, black, luxury, cmyk, autumn, business, acid,
     lemonade, night, coffee, winter, dim, nord, sunset, and more.
     Full list: https://daisyui.com/docs/themes/ -->
<html lang="en" data-theme="dracula">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{block "title" .}}App{{end}}</title>
  <link rel="stylesheet" href="/static/css/dist/app.css" />
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="min-h-screen bg-base-200">
  <nav class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="/" class="text-xl font-bold">App</a>
    </div>
    <div class="flex-none gap-2">
      {{if .User}}
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <ul tabindex="0" class="dropdown-content menu menu-sm z-[1] mt-3 w-48 rounded-box bg-base-100 shadow">
          <li><a href="/profile" class="flex w-full cursor-pointer items-center rounded-btn px-4 py-2 text-left text-sm hover:bg-base-200 active:bg-base-300">Profile</a></li>
          <li>
            <form method="post" action="/auth/logout" class="contents">
              <button type="submit" class="flex w-full cursor-pointer items-center rounded-btn px-4 py-2 text-left text-sm hover:bg-base-200 active:bg-base-300">Sign Out</button>
            </form>
          </li>
        </ul>
      </div>
      {{else}}
      {{block "nav-actions" .}}{{end}}
      {{end}}
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8 max-w-md">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>

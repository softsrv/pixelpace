{{define "title"}}Dashboard{{end}}

{{define "content"}}
<div class="space-y-6">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title">Welcome back</h2>
      <p class="text-base-content/70">{{.User.Email}}</p>
      {{if not .User.EmailVerified}}
      <div class="alert alert-warning mt-2">
        <span>Your email is not verified. <a href="/verify-email" class="link">Verify now</a></span>
      </div>
      {{end}}
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title">Rowing Machine</h2>
      <p class="text-base-content/70">Connect a Concept2 PM5 rowing machine with Web Bluetooth.</p>
      <button id="bt-connect-btn" type="button" class="btn btn-primary">Connect Rowing Machine</button>
      <div id="bt-connection-info" class="alert alert-info hidden" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
{{end}}

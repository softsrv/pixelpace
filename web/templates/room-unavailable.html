{{define "title"}}{{or .Title "Race Unavailable"}}{{end}}

{{define "content"}}
<section class="pp-panel" aria-labelledby="pp-unavailable-title">
  <div class="pp-section items-center py-10 text-center">
    <div class="pp-ico-box pp-ico-xl mb-2">{{template "pp-icon-warn"}}</div>
    <p class="pp-kicker pp-arcade">Game over</p>
    <h1 id="pp-unavailable-title" class="pp-title pp-title-lg">{{or .Title "Race unavailable"}}</h1>
    <p class="pp-muted">{{.Message}}</p>
    <a href="/dashboard" class="pp-btn mt-2"><span aria-hidden="true">&#9664;</span> Back to dashboard</a>
  </div>
</section>
{{end}}
